<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="title-apple">Sleek Sketch - White on Black</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            z-index: 100;
            pointer-events: none;
        }

        .lang-switch {
            display: flex;
            gap: 0.5rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 0.3rem;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
        }

        .lang-btn {
            background: none;
            border: none;
            color: white;
            opacity: 0.4;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: 'Outfit', sans-serif;
            padding: 0.2rem 0.6rem;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            opacity: 0.8;
            background: rgba(255, 255, 255, 0.1);
        }

        .lang-btn.active {
            opacity: 1;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2);
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            width: 44px;
            height: 44px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .tool-btn.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: white;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .tool-btn.bright {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .tool-btn.bright:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .tool-btn img,
        .tool-btn svg {
            width: 32px;
            height: 32px;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .tool-btn:hover img,
        .tool-btn:hover svg {
            transform: scale(1.1);
        }

        .hint {
            position: static;
            transform: none;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #fff, #aaa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            pointer-events: auto;
        }

        .top-bar-spacer {
            width: 80px;
        }

        .back-btn {
            text-decoration: none;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.4) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            font-size: 0.8rem !important;
            padding: 0.4rem 0.8rem !important;
            border-radius: 8px !important;
            color: white !important;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1) !important;
        }
    </style>
</head>

<body data-page-title="title-apple">
    <div class="top-bar">
        <a href="index.html" class="btn secondary back-btn" data-i18n="back">Back</a>
        <div class="hint" data-i18n="hint">Draw with finger or mouse</div>
        <div class="top-bar-spacer"></div>
    </div>

    <div class="app-container">
        <div id="transformLayer">
            <div class="background-layer">
                <img id="baseImage" src="static/images/apple_base.jpg" alt="Background">
            </div>
            <canvas id="drawingCanvas"></canvas>
        </div>

        <div class="ui-overlay">
            <div class="toolbar glass">
                <div class="tool-group">
                    <button id="penBtn" class="tool-btn active" data-i18n="pen" data-i18n-title="pen" data-i18n-no-text>
                        <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0id2hpdGUiPjxwYXRoIGQ9Ik0zIDE3LjI1VjIxaDMuNzVMMTcuODEgOS45NGwtMy43NS0zLjc1TDMgMTcuMjV6TTIwLjcxIDcuMDRjLjM5LS4zOS4zOS0xLjAyIDAtMS40MWwtMi4zNC0yLjM0Yy0uMzktLjM5LTEuMDItLjM5LTEuNDEgMGwtMS44MyAxLjgzIDMuNzUgMy43NSAxLjgzLTEuODN6Ii8+PC9zdmc+"
                            alt="Pen">
                    </button>
                    <button id="eraserBtn" class="tool-btn" data-i18n="eraser" data-i18n-title="eraser"
                        data-i18n-no-text>
                        <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0id2hpdGUiPjxwYXRoIGQ9Ik0xOSAxOEg1Yy0xLjEgMC0yLS45LTItMlY4YzAtMS4xLjktMiAyLTJoMTRjMS4xIDAgMiAuOSAyIDJ2OGMwIDEuMS0uOSAyLTItMnpNNyAxNmg0VjhIN3Y4em0xMiAwdi04aC02djhoNnoiLz48L3N2Zz4="
                            alt="Eraser">
                    </button>
                    <button id="textBtn" class="tool-btn" data-i18n="text" data-i18n-title="text" data-i18n-no-text>
                        <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0id2hpdGUiPjxwYXRoIGQ9Ik01IDR2M2g1LjV2MTJoM1Y3SDE5VjR6Ii8+PC9zdmc+"
                            alt="Text">
                    </button>
                    <div class="divider"></div>
                    <label for="brushSize" data-i18n="brush-size">Size</label>
                    <input type="range" id="brushSize" min="1" max="50" value="5">
                    <span id="sizeValue">5px</span>
                </div>
                <div class="divider"></div>
                <button id="undoBtn" class="tool-btn bright" data-i18n="undo" data-i18n-title="undo" data-i18n-no-text>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path fill="#FFFFFF" d="M88 256L232 256C241.7 256 250.5 250.2 254.2 241.2C257.9 232.2 255.9 221.9 249 215L202.3 168.3C277.6 109.7 386.6 115 455.8 184.2C530.8 259.2 530.8 380.7 455.8 455.7C380.8 530.7 259.3 530.7 184.3 455.7C174.1 445.5 165.3 434.4 157.9 422.7C148.4 407.8 128.6 403.4 113.7 412.9C98.8 422.4 94.4 442.2 103.9 457.1C113.7 472.7 125.4 487.5 139 501C239 601 401 601 501 501C601 401 601 239 501 139C406.8 44.7 257.3 39.3 156.7 122.8L105 71C98.1 64.2 87.8 62.1 78.8 65.8C69.8 69.5 64 78.3 64 88L64 232C64 245.3 74.7 256 88 256z"/></svg>
                </button>
                <button id="redoBtn" class="tool-btn bright" data-i18n="redo" data-i18n-title="redo" data-i18n-no-text>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -64 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path fill="#FFFFFF" d="M488 192l-144 0c-9.7 0-18.5-5.8-22.2-14.8s-1.7-19.3 5.2-26.2l46.7-46.7c-75.3-58.6-184.3-53.3-253.5 15.9-75 75-75 196.5 0 271.5s196.5 75 271.5 0c8.2-8.2 15.5-16.9 21.9-26.1 10.1-14.5 30.1-18 44.6-7.9s18 30.1 7.9 44.6c-8.5 12.2-18.2 23.8-29.1 34.7-100 100-262.1 100-362 0S-25 175 75 75c94.3-94.3 243.7-99.6 344.3-16.2L471 7c6.9-6.9 17.2-8.9 26.2-5.2S512 14.3 512 24l0 144c0 13.3-10.7 24-24 24z"/></svg>
                </button>
                <div class="divider"></div>
                <button id="clearBtn" class="btn secondary" data-i18n="clear">Clear</button>
                <button id="saveBtn" class="btn primary" data-i18n="save">Save</button>
            </div>
        </div>

        <!-- Hint moved to top-bar -->

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="modal-overlay hidden">
            <div class="loader-content">
                <div class="modern-spinner"></div>
                <p data-i18n="processing">Processing Image...</p>
            </div>
        </div>

        <!-- Result Modal -->
        <div id="resultModal" class="modal-overlay hidden">
            <div class="modal-content glass">
                <div class="modal-header">
                    <h3 data-i18n="result-title">Processed Result</h3>
                    <button id="closeModal" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <img id="resultImage" src="" alt="Result Image">
                </div>
                <div class="modal-footer" style="flex-direction: column; gap: 1rem;">
                    <p data-i18n="share-prompt"
                        style="font-size: 0.9rem; opacity: 0.8; text-align: center; margin-bottom: 0.5rem;">Share on SNS
                        with hashtag #PassAppleApp!</p>
                    <div style="display: flex; gap: 1rem; width: 100%; justify-content: center;">
                        <button id="downloadBtn" class="btn primary" data-i18n="download">Download Result</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="i18n.js"></script>
    <script src="config.js"></script>
    <script src="main.js"></script>
    <script>
        function updateActiveLang() {
            const current = i18n.currentLang();
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const btn = document.getElementById('btn-' + current);
            if (btn) btn.classList.add('active');
        }
        document.addEventListener('DOMContentLoaded', updateActiveLang);
    </script>
</body>

</html>
