<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 24px; line-height: 1.6; }
      button { padding: 8px 12px; cursor: pointer; }
      pre { background: #f5f5f5; padding: 12px; white-space: pre-wrap; }
      img { max-width: 100%; border: 1px solid #ddd; margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1>{{ title }}</h1>
    <p>Method: {{ method }}</p>
    <button id="runButton">白い部分だけを重ねて出力</button>

    <pre id="result">待機中...</pre>
    <img id="outputImage" alt="出力画像" />

    <script>
      const resultEl = document.getElementById('result');
      const runButton = document.getElementById('runButton');
      const outputImage = document.getElementById('outputImage');

      async function loadImage(url) {
        const response = await fetch(url);
        const blob = await response.blob();
        return await createImageBitmap(blob);
      }

      function canvasFromImage(image, width, height) {
        const canvas = document.createElement('canvas');
        canvas.width = width || image.width;
        canvas.height = height || image.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        return canvas;
      }

      async function handleAppleRequest() {
        resultEl.textContent = '処理中...';

        try {
          const baseImage = await loadImage('/static/apple_base.jpg');
          const overlayImage = await loadImage('/static/apple_input.jpg');
          const width = baseImage.width;
          const height = baseImage.height;

          const baseCanvas = canvasFromImage(baseImage, width, height);
          const overlayCanvas = canvasFromImage(overlayImage, width, height);

          const baseCtx = baseCanvas.getContext('2d');
          const overlayCtx = overlayCanvas.getContext('2d');
          const baseData = baseCtx.getImageData(0, 0, width, height).data;
          const overlayData = overlayCtx.getImageData(0, 0, width, height).data;

          for (let y = 0; y < height; y += 1) {
            for (let x = 0; x < width; x += 1) {
              const idx = (y * width + x) * 4;
              const r = overlayData[idx];
              const g = overlayData[idx + 1];
              const b = overlayData[idx + 2];
              const a = overlayData[idx + 3];

              const isWhite = r > 240 && g > 240 && b > 240 && a > 200;
              if (isWhite) {
                continue;
              }

              if (a > 0) {
                baseData[idx] = r;
                baseData[idx + 1] = g;
                baseData[idx + 2] = b;
                baseData[idx + 3] = a;
              }
            }
          }

          baseCtx.putImageData(new ImageData(baseData, width, height), 0, 0);
          const dataUrl = baseCanvas.toDataURL('image/png');
          outputImage.src = dataUrl;

          const response = await fetch('/api/composite', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              baseImage: dataUrl,
              overlayImage: dataUrl,
              width,
              height
            })
          });

          const json = await response.json();
          resultEl.textContent = JSON.stringify(json, null, 2);
          if (json.status === 'success') {
            outputImage.src = json.path.startsWith('http') ? json.path : `${window.location.origin}${json.path}`;
          }
        } catch (error) {
          resultEl.textContent = 'エラー: ' + error.message;
        }
      }

      runButton.addEventListener('click', handleAppleRequest);
    </script>
  </body>
</html>
